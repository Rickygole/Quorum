<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-labelledby="qtitle qdesc" font-family="Helvetica, Arial, sans-serif">
  <title id="qtitle">Quorum pipeline architecture</title>
  <desc id="qdesc">Cached Legistar and eGIS parcel sources feed an ingestion and normalization layer, which feeds a Strands Graph of five fixed-order nodes (Civic Analyst, Resolution, Continuity, Relevance, Action) deployed on Bedrock AgentCore Runtime, where the four agent nodes call Amazon Bedrock and the Resolution node is deterministic code with no model call. Output goes to a static site, then to a human approval gate where the pipeline stops.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1010" rx="20" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#e2e8f0">Quorum: pipeline architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="13.5" fill="#94a3b8">Baltimore City Council legislative record, matched to an address, checked for continuity, and stopped before anything is sent</text>

  <!-- Sources -->
  <rect x="60" y="92" width="520" height="84" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="122" text-anchor="middle" font-size="18" font-weight="600" fill="#e2e8f0">Legistar Web API</text>
  <text x="320" y="144" text-anchor="middle" font-size="12.5" fill="#94a3b8">Baltimore City Council legislative record</text>
  <text x="320" y="163" text-anchor="middle" font-size="11.5" fill="#64748b">cached to disk, fetch timestamp shown on screen</text>

  <rect x="620" y="92" width="520" height="84" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="880" y="122" text-anchor="middle" font-size="18" font-weight="600" fill="#e2e8f0">Baltimore eGIS Parcel Layer</text>
  <text x="880" y="144" text-anchor="middle" font-size="12.5" fill="#94a3b8">237,092 parcels, dmxOwnership/Properties</text>
  <text x="880" y="163" text-anchor="middle" font-size="11.5" fill="#64748b">cached to disk, fetch timestamp shown on screen</text>

  <path d="M320,176 L320,206" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M880,176 L880,206" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Ingestion -->
  <rect x="60" y="206" width="1080" height="84" rx="10" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="600" y="236" text-anchor="middle" font-size="18" font-weight="600" fill="#e2e8f0">Ingestion &amp; normalization</text>
  <text x="600" y="258" text-anchor="middle" font-size="12.5" fill="#94a3b8">Parses matters, normalizes addresses, resolves block and lot references</text>
  <text x="600" y="277" text-anchor="middle" font-size="11.5" fill="#64748b">1,679 matters read, 266 name a parcel Quorum can parse</text>

  <path d="M600,290 L600,320" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- AgentCore Runtime outer box -->
  <rect x="60" y="320" width="1080" height="330" rx="14" fill="#38bdf8" fill-opacity="0.04" stroke="#38bdf8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="80" y="344" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">BEDROCK AGENTCORE RUNTIME</text>
  <text x="80" y="360" font-size="11" fill="#7dd3fc" opacity="0.85">deployment target, OpenTelemetry tracing</text>

  <!-- Legend -->
  <rect x="860" y="332" width="260" height="52" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <rect x="872" y="340" width="15" height="15" rx="3" fill="#1d4ed8" stroke="#3b82f6"/>
  <text x="894" y="352" font-size="11" fill="#cbd5e1">agent, Bedrock model call</text>
  <rect x="872" y="361" width="15" height="15" rx="3" fill="#334155" stroke="#94a3b8" stroke-dasharray="3 2"/>
  <text x="894" y="373" font-size="11" fill="#cbd5e1">code, no model call</text>

  <!-- Strands Graph inner box -->
  <rect x="90" y="396" width="1020" height="224" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="418" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">STRANDS GRAPH</text>
  <text x="110" y="434" font-size="11" fill="#94a3b8">five nodes, fixed order, no dynamic handoff</text>

  <!-- Bedrock band -->
  <rect x="110" y="444" width="980" height="40" rx="8" fill="#78350f" fill-opacity="0.28" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="469" text-anchor="middle" font-size="13" font-weight="600" fill="#fbbf24">Amazon Bedrock, foundation model provider</text>

  <!-- connectors band to agent nodes (not Resolution) -->
  <path d="M204,484 L204,504" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M600,484 L600,504" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M798,484 L798,504" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M996,484 L996,504" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Nodes -->
  <rect x="113" y="504" width="182" height="76" rx="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="204" y="536" text-anchor="middle" font-size="16" font-weight="600" fill="#f1f5f9">Civic Analyst</text>
  <text x="204" y="556" text-anchor="middle" font-size="11" fill="#dbeafe">extracts structured facts</text>

  <rect x="311" y="504" width="182" height="76" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="402" y="536" text-anchor="middle" font-size="16" font-weight="600" fill="#f1f5f9">Resolution</text>
  <text x="402" y="556" text-anchor="middle" font-size="11" fill="#cbd5e1">matches address to parcel</text>

  <rect x="509" y="504" width="182" height="76" rx="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="536" text-anchor="middle" font-size="16" font-weight="600" fill="#f1f5f9">Continuity</text>
  <text x="600" y="556" text-anchor="middle" font-size="11" fill="#dbeafe">same issue, or a new one</text>

  <rect x="707" y="504" width="182" height="76" rx="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="798" y="536" text-anchor="middle" font-size="16" font-weight="600" fill="#f1f5f9">Relevance</text>
  <text x="798" y="556" text-anchor="middle" font-size="11" fill="#dbeafe">does it affect this resident</text>

  <rect x="905" y="504" width="182" height="76" rx="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="996" y="536" text-anchor="middle" font-size="16" font-weight="600" fill="#f1f5f9">Action</text>
  <text x="996" y="556" text-anchor="middle" font-size="11" fill="#dbeafe">headline and draft comment</text>

  <path d="M295,542 L311,542" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M493,542 L509,542" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M691,542 L707,542" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M889,542 L905,542" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- exit to static site -->
  <path d="M996,580 L996,690 L600,690 L600,720" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Static site -->
  <rect x="300" y="720" width="600" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="752" text-anchor="middle" font-size="18" font-weight="600" fill="#d1fae5">Static site</text>
  <text x="600" y="774" text-anchor="middle" font-size="12" fill="#6ee7b7">Thread, evidence, feed, drafted comment, plain files, no server</text>
  <text x="600" y="793" text-anchor="middle" font-size="11" fill="#34d399">what a resident and a judge both see</text>

  <path d="M600,810 L600,846" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Human approval gate -->
  <polygon points="561,834 639,834 666,861 666,939 639,966 561,966 534,939 534,861" fill="#7f1d1d" stroke="#f87171" stroke-width="2.5"/>
  <text x="600" y="886" text-anchor="middle" font-size="15" font-weight="700" fill="#fecaca" letter-spacing="1.5">HUMAN</text>
  <text x="600" y="906" text-anchor="middle" font-size="15" font-weight="700" fill="#fecaca" letter-spacing="1.5">APPROVAL</text>
  <text x="600" y="926" text-anchor="middle" font-size="15" font-weight="700" fill="#fecaca" letter-spacing="1.5">GATE</text>

  <text x="600" y="990" text-anchor="middle" font-size="12.5" fill="#94a3b8">Quorum drafts a public comment and stops. The resident sends it, or does not.</text>
</svg>
